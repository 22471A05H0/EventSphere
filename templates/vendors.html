{% extends 'base.html' %}{% block content %}<div class="row g-3"><div class="col-md-4"><div class="card p-4"><h3>Add Vendor</h3><form method="post">{% csrf_token %}{{form.as_p}}<button class="btn btn-primary">Add</button></form></div></div><div class="col-md-8"><div class="card p-4"><h3>Vendors</h3><table class="table"><tr><th>Name</th><th>Service</th><th>Rating</th><th></th></tr>{% for v in vendors %}<tr><td>{{v.name}}</td><td>{{v.service_type}}</td><td>{{v.overall_rating}}</td><td><a class="btn btn-sm btn-outline-primary" href="/vendors/{{v.id}}/rate/">Rate</a></td></tr>{% endfor %}</table></div></div></div>{% endblock %}
