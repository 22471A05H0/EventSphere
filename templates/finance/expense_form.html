{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card p-4">

        <h2>Add Expense</h2>

        <h5>{{ event.name }}</h5>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-danger">
                Save Expense
            </button>

            <a href="{% url 'finance_dashboard' event.id %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
