{% extends 'base.html' %}{% block content %}<div class="row g-3"><div class="col-md-4"><div class="card p-4"><h3>Add Resource</h3><form method="post">{% csrf_token %}{{form.as_p}}<button class="btn btn-primary">Add</button></form></div></div><div class="col-md-8"><div class="card p-4"><h3>Inventory</h3><table class="table"><tr><th>Resource</th><th>Total</th><th>Available</th></tr>{% for r in resources %}<tr><td>{{r.name}}</td><td>{{r.total_quantity}}</td><td>{{r.available_quantity}}</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
