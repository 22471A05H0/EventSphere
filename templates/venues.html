{% extends 'base.html' %}{% block content %}<div class="row g-3"><div class="col-md-4"><div class="card p-4"><h3>Add Venue</h3><form method="post">{% csrf_token %}{{form.as_p}}<button class="btn btn-primary">Add</button></form></div></div><div class="col-md-8"><div class="card p-4"><h3>Venues</h3><table class="table"><tr><th>Name</th><th>Location</th><th>Capacity</th><th>Available</th></tr>{% for v in venues %}<tr><td>{{v.name}}</td><td>{{v.location}}</td><td>{{v.capacity}}</td><td>{{v.available|yesno:'Yes,No'}}</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
