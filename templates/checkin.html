{% extends 'base.html' %}{% block content %}<div class="card p-4"><h3>Participant Check-in</h3><form method="post" class="row g-2">{% csrf_token %}<div class="col-md-8"><input name="ticket_id" class="form-control" placeholder="TKT1001" required></div><div class="col-md-4"><button class="btn btn-success w-100">Verify & Check In</button></div></form>{% if attendee %}<hr><h4>{{attendee.name}}</h4><p>{{attendee.event.name}} | {{attendee.email}}</p><span class="badge bg-success">{{attendee.attendance_status}}</span>{% endif %}</div>{% endblock %}
