{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h3>
                    Sponsorship Approval
                </h3>

                <hr>

                <p>
                    <strong>Sponsor:</strong>
                    {{ sponsorship.sponsor_name }}
                </p>

                <p>
                    <strong>Event:</strong>
                    {{ sponsorship.event.name }}
                </p>

                <p>
                    <strong>Type:</strong>
                    {{ sponsorship.sponsorship_type }}
                </p>

                <p>
                    <strong>Amount:</strong>
                    ₹{{ sponsorship.amount }}
                </p>

                <p>
                    <strong>Benefits:</strong>
                    {{ sponsorship.benefits }}
                </p>


                <form method="post">

                    {% csrf_token %}

                    <div class="d-flex gap-2">

                        <button
                            name="action"
                            value="approve"
                            class="btn btn-success"
                        >
                            Approve
                        </button>

                        <button
                            name="action"
                            value="reject"
                            class="btn btn-danger"
                        >
                            Reject
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
