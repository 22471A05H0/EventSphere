{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        My Profile
                    </h4>

                </div>

                <div class="card-body">

                    <p>

                        **Username:**

                        {{ request.user.username }}

                    </p>

                    <p>

                        **Email:**

                        {{ request.user.email }}

                    </p>

                    <hr>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            class="btn btn-primary"
                            type="submit"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'accounts:dashboard' %}"
                            class="btn btn-secondary"
                        >
                            Back
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
