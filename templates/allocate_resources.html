{% extends 'base.html' %}{% block content %}<div class="card p-4"><h3>Allocate Resources – {{event.name}}</h3><form method="post" class="row g-2">{% csrf_token %}<div class="col-md-6">{{form.resource}}</div><div class="col-md-3">{{form.quantity}}</div><div class="col-md-3"><button class="btn btn-primary">Allocate</button></div></form><hr><table class="table"><tr><th>Resource</th><th>Quantity</th><th>Status</th></tr>{% for a in allocations %}<tr><td>{{a.resource.name}}</td><td>{{a.quantity}}</td><td>{{a.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
